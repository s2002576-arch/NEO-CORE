<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEO CORE</title>
<style>
  body {
  margin: 0;
  background: #050b18;
  color: #eaf5ff;
  font-family: Arial, sans-serif;
}
#callingCardSection {
  background: linear-gradient(145deg,#080b18,#17152b);
  border: 1px solid #555477;
  box-shadow: 0 0 25px #17103c;
}

.calling-card {
  position: relative;
  overflow: hidden;
  min-height: 145px;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  color: white;
  font-weight: 900;
  letter-spacing: 3px;
  border: 2px solid white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-shadow: 0 2px 5px black;
}

.calling-card h3 {
  font-size: 25px;
  margin: 8px;
  position: relative;
  z-index: 1;
}

.calling-card p {
  margin: 5px;
  position: relative;
  z-index: 1;
}

.calling-card::before {
  content: "✦";
  position: absolute;
  font-size: 100px;
  right: 8px;
  top: 10px;
  opacity: .2;
}

.calling-card.owned {
  box-shadow: 0 0 18px #ffffff55;
}

.calling-card.locked {
  filter: grayscale(1);
  opacity: .35;
}

.calling-card.bronze {
  background: linear-gradient(120deg,#351b0b,#c17b32,#281307);
  border-color: #d99a58;
}

.calling-card.silver {
  background: linear-gradient(120deg,#253449,#c5d9ed,#26334b);
  border-color: #d9eaff;
}

.calling-card.gold {
  background: linear-gradient(120deg,#583600,#ffd447,#754400);
  border-color: #ffe58a;
}

.calling-card.platinum {
  background: linear-gradient(120deg,#092c50,#38b9ed,#182b59);
  border-color: #a9edff;
}

.calling-card.legendary {
  background: linear-gradient(135deg,#17002f,#6c16bb,#17002f);
  border: 2px solid #e3b5ff;
  box-shadow: 0 0 20px #a000ff;
  animation: legendaryGlow 1.2s infinite alternate;
}

.calling-card.legendary::before {
  content: "⚡";
  font-size: 110px;
  color: #f4d6ff;
  opacity: .65;
  animation: lightningFlash .7s infinite alternate;
}

@keyframes legendaryGlow {
  from { box-shadow: 0 0 10px #8b00ff; }
  to { box-shadow: 0 0 35px #d000ff,0 0 55px #7100ff; }
}

@keyframes lightningFlash {
  from { opacity: .25; }
  to { opacity: .9; }
}
</style>
</head>
<body>
<header>
<h1>NEO CORE</h1>
<div class="sub">EVOLVE BEYOND LIMITS</div>
</header>
<main>
<section class="panel">
<div class="small">YOUR CREDITS</div>
<div class="money" id="money">0 円</div>
<div class="small" id="power">1 円 / TAP</div>
<div class="core">
<div class="small">TAP TO EVOLVE</div>
<div class="hand" id="hand" onclick="tap()"></div>
<div><button onclick="tap()">COREをタップ！</button></div>
</div>
<div id="notice"></div>
</section>

<section class="panel">
<h2>🏆 RANK SYSTEM</h2>
<div class="rankhead">
<div class="emblem bronze" id="emblem">★</div>
<div style="flex:1">
<div class="small" style="text-align:left">CURRENT RANK</div>
<strong id="rankname">ブロンズ</strong>
<div class="small" id="rankpoints" style="text-align:left">0 RP</div>
</div>
</div>
<div class="bar"><div class="fill" id="rankbar"></div></div>
<div class="row small"><span id="current">0</span><span id="next">次のランクまで 200 RP</span></div>
<div class="small" style="margin-top:10px">RPは累計獲得クレジットと連動</div>
</section>

<div class="tabs">
<button onclick="show('upgrades')">強化ショップ</button>
<button onclick="show('camos')">迷彩ショップ</button>
<button onclick="show('ranks')">ランク一覧</button>
</div>
<section class="panel" id="shop">
<h2>⚡ TAP UPGRADES</h2>
<div id="upgrades"></div>
</section>
</main>
<script>
let money=0, total=0, power=1;
let bought=[];
let owned=[], equipped="";
const upgrades=[
{price:100,power:3},
{price:1000,power:10},
{price:10000,power:100},
{price:100000,power:500}
];
const camos=[
{name:"GOLD",price:1000,cls:"gold"},
{name:"PLATINUM",price:5000,cls:"platinum"},
{name:"DIAMOND",price:20000,cls:"diamond"},
{name:"DARK SPINE",price:50000,cls:"spine"},
{name:"DARK MATTER",price:100000,cls:"matter"},
{name:"SINGULARITY",price:150000,cls:"singularity"}
];
const ranks=[
{name:"ブロンズ",need:0,cls:"bronze"},
{name:"シルバー",need:200,cls:"silver"},
{name:"ゴールド",need:800,cls:"goldrank"},
{name:"プラチナ",need:5000,cls:"platinum"},
{name:"ダイアモンド",need:10000,cls:"diamond"},
{name:"クリムゾン",need:20000,cls:"crimson"},
{name:"レインボー",need:50000,cls:"rainbow"},
{name:"ベテラン",need:100000,cls:"veteran"},
{name:"マスター",need:1000000,cls:"master"},
{name:"レジェンド",need:10000000,cls:"legend"}
];
function tap(){
 money+=power;total+=power;
 checkCallingCards();
 update();
}
 const callingCards = [
  { name: "BRONZE", credits: 100 },
  { name: "SILVER", credits: 1000 },
  { name: "GOLD", credits: 10000 },
  { name: "PLATINUM", credits: 100000 },
  { name: "LEGENDARY", credits: 1000000 }
];

let unlockedCards = JSON.parse(localStorage.getItem("neoCallingCards") || "[]");

function checkCallingCards() {
  callingCards.forEach(card => {
    if (total >= card.credits && !unlockedCards.includes(card.name)) {
      unlockedCards.push(card.name);
      localStorage.setItem("neoCallingCards", JSON.stringify(unlockedCards));
      alert("CALLING CARD UNLOCKED: " + card.name);
    }
  });

  renderCallingCards();
}
function update(){
 document.getElementById("money").textContent=money.toLocaleString()+" 円";
 document.getElementById("power").textContent=power.toLocaleString()+" 円 / TAP";
 let rp=total;
 let idx=0;
 for(let i=0;i<ranks.length;i++)if(rp>=ranks[i].need)idx=i;
 let r=ranks[idx],next=ranks[idx+1];
 document.getElementById("rankname").textContent=r.name;
 document.getElementById("rankpoints").textContent=rp.toLocaleString()+" RP";
 let emblem=document.getElementById("emblem");
 emblem.className="emblem "+r.cls;
 document.getElementById("current").textContent=rp.toLocaleString()+" RP";
 if(next){
 let pct=Math.min(100,(rp-r.need)/(next.need-r.need)*100);
 document.getElementById("rankbar").style.width=pct+"%";
 document.getElementById("next").textContent="次のランク："+next.name+" まで "+Math.max(0,next.need-rp).toLocaleString()+" RP";
 }else{
 let pct=Math.min(100,rp/1000000*100);
 document.getElementById("rankbar").style.width=pct+"%";
 document.getElementById("next").textContent="最高ランク！ 10,000,000 RPで完全制覇";
 }
 renderUpgrades();
}
function renderUpgrades(){
 document.getElementById("upgrades").innerHTML=upgrades.map((u,i)=>`
 <div class="item"><div><b>タップ強化 ${i+1}</b><small>${u.price.toLocaleString()}円 → ${u.power}円 / TAP</small></div>
 <button ${bought.includes(i)||money<u.price?"disabled":""} onclick="buyUpgrade(${i})">${bought.includes(i)?"購入済み":"購入"}</button></div>`).join("");
}
function buyUpgrade(i){
 let u=upgrades[i];if(money<u.price||bought.includes(i))return;
 money-=u.price;power=u.power;bought.push(i);
 document.getElementById("notice").textContent="タップ強化を購入した！";
 update();
}
function show(type){
 let el=document.getElementById("shop");
 if(type==="upgrades"){
 el.innerHTML='<h2>⚡ TAP UPGRADES</h2><div id="upgrades"></div>';
 renderUpgrades();
 }
 if(type==="camos"){
 el.innerHTML='<h2>🎨 CAMO SHOP</h2>'+camos.map((c,i)=>`
 <div class="item"><div><b>${c.name}</b><small>${c.price.toLocaleString()}円</small></div>
 <button onclick="camoAction(${i})">${owned.includes(i)?(equipped===c.cls?"装備中":"装備"):(money>=c.price?"購入":"購入不可")}</button></div>`).join("");
 }
 if(type==="ranks"){
 el.innerHTML='<h2>🏆 RANK LIST</h2>'+ranks.map(r=>`
 <div class="item"><div class="emblem ${r.cls}" style="width:48px;height:52px;font-size:20px">★</div><div style="flex:1"><b>${r.name}</b><small>${r.need.toLocaleString()} RP</small></div></div>`).join("")+
 '<div class="small">1,000,000 RP：レジェンド完全制覇</div>';
 }
}
function camoAction(i){
 let c=camos[i];
 if(!owned.includes(i)){
 if(money<c.price)return;
 money-=c.price;owned.push(i);
 }
 equipped=c.cls;
 document.getElementById("hand").className="hand "+equipped;
 document.getElementById("notice").textContent=c.name+" を装備した！";
 show("camos");update();
}
update();
</script>
 <section id="callingCardSection" style="margin:30px auto;max-width:900px;padding:20px;background:#101522;border:1px solid #39445c;border-radius:16px;color:white;">
  <h2 style="text-align:center;letter-spacing:3px;">CALLING CARDS</h2>
  <div id="callingCardList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;"></div>
</section>

<style>
.calling-card {
  padding:20px;
  min-height:110px;
  border-radius:12px;
  text-align:center;
  border:2px solid #777;
  background:linear-gradient(135deg,#252525,#080808);
  color:white;
  font-weight:bold;
  letter-spacing:2px;
}
.calling-card.owned {box-shadow:0 0 15px #888;}
.calling-card.locked {opacity:.35;filter:grayscale(1);}
.calling-card.legendary {
  border-color:#b66aff;
  background:linear-gradient(135deg,#210044,#090018,#4b1680);
  box-shadow:0 0 20px #a000ff;
  animation:lightning 1.5s infinite alternate;
}
@keyframes lightning {
  from {box-shadow:0 0 8px #8b00ff;}
  to {box-shadow:0 0 28px #d8aaff,0 0 45px #7900ff;}
}
</style>

<script>
function renderCallingCards() {
  const list = document.getElementById("callingCardList");
  if (!list) return;

  list.innerHTML = "";

  callingCards.forEach(card => {
    const owned = unlockedCards.includes(card.name);
    const item = document.createElement("div");

   item.className = "calling-card " + card.name.toLowerCase() + (owned ? " owned" : " locked");
      (owned ? "owned " : "locked ") +
      (card.name === "LEGENDARY" ? "legendary" : "");

    item.innerHTML =
      "<h3>" + (owned ? card.name : "LOCKED") + "</h3>" +
      "<p>" + card.credits.toLocaleString() + " CREDIT</p>" +
      "<p>" + (owned ? "UNLOCKED" : "NOT UNLOCKED") + "</p>";

    list.appendChild(item);
  });
}

renderCallingCards();
</script>
</body>
</html>
